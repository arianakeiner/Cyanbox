<!doctype html>
<html lang="es" data-style="classic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cyanbox · Gestión gastronómica</title>
    <script>try{var d=document.documentElement,p=localStorage.getItem('cyanboxTheme')||'light',s=localStorage.getItem('cyanboxStyle')||'classic';d.setAttribute('data-style',s==='cozy'?'cozy':'classic');if(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))d.setAttribute('data-theme','dark')}catch(e){}</script>
    <!-- Tipografías opcionales: sin internet se usan fuentes del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
